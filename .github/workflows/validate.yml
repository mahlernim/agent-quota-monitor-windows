name: Windows validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Python, JavaScript, and WPF
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Check Copilot bridge JavaScript
        run: |
          node --check quota/copilot_bridge.mjs
          node --check quota/copilot_bridge_data.mjs
      - name: Test Copilot bridge
        run: node tests/test_copilot_bridge.mjs
      - name: Generate native icon
        run: python packaging/make_icon.py
      - name: Build WPF application
        run: dotnet build native/AgentQuotaMonitor.csproj -c Release --nologo
      - name: Check native rendering
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'agent-quota-rendering.json'
          $app = Join-Path $PWD 'native/bin/Release/net10.0-windows/agent-quota-monitor-windows.exe'
          $process = Start-Process -FilePath $app -ArgumentList '--self-test-output', ('"' + $report + '"') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { throw 'Native rendering check timed out.' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Native rendering check failed.' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.passed -or $result.providerReads -ne 0) { throw 'Native rendering check must pass without provider reads.' }
      - name: Test native backend requests
        run: python tests/check_native_requests.py dotnet
      - name: Test native account controls
        run: dotnet run --project tests/native-accounts/AccountTests.csproj -c Release
      - name: Test backend compatibility and ownership
        run: dotnet run --project tests/native-backend/BackendTests.csproj -c Release
      - name: Test native startup and shutdown
        run: dotnet run --project tests/native-lifecycle/LifecycleTests.csproj -c Release
      - name: Test real Windows reader startup
        run: python tests/check_native_startup.py dotnet
      - name: Test update policy
        run: dotnet run --project tests/native-updates/UpdateTests.csproj
